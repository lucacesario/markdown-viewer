<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>/* __CSS__ */</style>
</head>
<body>
  <div id="titlebar">
    <div class="titlebar-actions">
      <button id="btn-new" title="New (Ctrl+N)">
        <svg viewBox="0 0 16 16" fill="none"
            stroke="currentColor"
            stroke-width="1.2"
            stroke-linecap="round"
            stroke-linejoin="round">
          <path d="M4 1.5h5.5L13 5v8.5a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-11a1 1 0 0 1 1-1z"/>
          <path d="M9.5 1.5V5H13"/>
          <path d="M6 9h4"/>
          <path d="M8 7v4"/>
        </svg>
      </button>
      <button id="btn-open" title="Open (Ctrl+O)">
        <svg viewBox="0 0 16 16" fill="none"><path d="M2 13V4.5a1 1 0 0 1 1-1h3l1.5 1.5H13a1 1 0 0 1 1 1V13a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1z" stroke="currentColor" stroke-width="1.2"/></svg>
      </button>
      <button id="btn-save" title="Save (Ctrl+S)">
        <svg viewBox="0 0 16 16" fill="none"
            stroke="currentColor"
            stroke-width="1.2"
            stroke-linecap="round"
            stroke-linejoin="round">
          <path d="M3 1.5h8l3 3v9a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1v-11a1 1 0 0 1 1-1z"/>
          <path d="M5 1.5V5h5V1.5"/>
          <rect x="4.5" y="9" width="7" height="4.5" rx="0.5"/>
        </svg>
      </button>
      <button id="btn-print" title="Export PDF (Ctrl+P)">
        <svg
          viewBox="0 0 16 16"
          fill="none"
          stroke="currentColor"
          stroke-width="1.2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M4 6V1.5h8V6"/>
          <rect x="2" y="6" width="12" height="6" rx="1.5"/>
          <path d="M4 10h8v4.5H4z"/>
        </svg>
      </button>
      <div class="titlebar-sep"></div>
      <button id="btn-toggle" title="Toggle Preview (Ctrl+E)">
        <svg id="icon-preview" viewBox="0 0 16 16" fill="none"><path d="M1 8s2.5-5 7-5 7 5 7 5-2.5 5-7 5-7-5-7-5z" stroke="currentColor" stroke-width="1.2"/><circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="1.2"/></svg>
        <svg id="icon-edit" viewBox="0 0 16 16" fill="none" style="display:none"><path d="M11.5 1.5l3 3L5 14H2v-3L11.5 1.5z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/><path d="M9.5 3.5l3 3" stroke="currentColor" stroke-width="1.2"/></svg>
      </button>
      <button id="btn-split" title="Split View (Ctrl+\)">
        <svg viewBox="0 0 16 16" fill="none"><rect x="1.5" y="1.5" width="13" height="13" rx="1.5" stroke="currentColor" stroke-width="1.2"/><line x1="8" y1="2" x2="8" y2="14" stroke="currentColor" stroke-width="1.2"/></svg>
      </button>
      <button id="btn-toc" title="Outline (Ctrl+Shift+O)">
        <svg viewBox="0 0 16 16" fill="none"><path d="M3 3h10M3 6.5h7M3 10h8M3 13.5h5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
      </button>
      <button id="btn-guide" title="Markdown Guide (Ctrl+G)">
        <svg viewBox="0 0 16 16" fill="none"
            stroke="currentColor"
            stroke-width="1.2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true">
          <circle cx="8" cy="8" r="6"/>
          <path d="M6.5 6.2a1.7 1.7 0 1 1 2.7 1.4C8.4 8.2 8 8.6 8 9.5"/>
          <circle cx="8" cy="11.7" r="0.55"
                  fill="currentColor"
                  stroke="none"/>
        </svg>
      </button>
    </div>
    <span id="titlebar-title">Untitled</span>
    <div id="window-controls">
      <button id="btn-theme" title="Toggle Theme">
        <svg id="icon-sun" viewBox="0 0 16 16" fill="none" style="display:none"><circle cx="8" cy="8" r="3" stroke="currentColor" stroke-width="1.2"/><path d="M8 2v1.5M8 12.5V14M2 8h1.5M12.5 8H14M3.75 3.75l1.06 1.06M11.19 11.19l1.06 1.06M3.75 12.25l1.06-1.06M11.19 4.81l1.06-1.06" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
        <svg id="icon-moon" viewBox="0 0 16 16" fill="none"><path d="M13.5 8.5a5.5 5.5 0 0 1-6-6 5.5 5.5 0 1 0 6 6z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>
      </button>
      <div class="window-controls-sep"></div>
      <button id="btn-minimize" title="Minimize">
        <svg viewBox="0 0 10 10"><line x1="2" y1="5" x2="8" y2="5"/></svg>
      </button>
      <button id="btn-maximize" title="Maximize">
        <svg viewBox="0 0 10 10"><rect x="1.5" y="1.5" width="7" height="7" rx="1"/></svg>
      </button>
      <button id="btn-close" title="Close">
        <svg viewBox="0 0 10 10"><line x1="2" y1="2" x2="8" y2="8"/><line x1="8" y1="2" x2="2" y2="8"/></svg>
      </button>
    </div>
  </div>

  <div id="tab-bar"></div>

  <div id="find-bar">
    <input id="find-input" type="text" placeholder="Find..." spellcheck="false">
    <span id="find-count"></span>
    <button id="find-prev" title="Previous (Shift+Enter)">
      <svg viewBox="0 0 10 10"><polyline points="2,7 5,3 8,7" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button id="find-next" title="Next (Enter)">
      <svg viewBox="0 0 10 10"><polyline points="2,3 5,7 8,3" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button id="find-close" title="Close (Escape)">
      <svg viewBox="0 0 10 10"><line x1="2" y1="2" x2="8" y2="8"/><line x1="8" y1="2" x2="2" y2="8"/></svg>
    </button>
  </div>

  <div id="content">
    <div id="toc-panel">
      <div id="toc-list"></div>
    </div>
    <div id="editor-container" class="active">
      <div id="recent-panel"></div>

      <div id="editor-shell">
        <div id="line-numbers" aria-hidden="true">1</div>

        <textarea
          id="editor"
          placeholder="Start typing here…  Need help? Press the ? button in the status bar or Ctrl+G for the Markdown Guide"
          spellcheck="false"
        ></textarea>
      </div>
    </div>

    <div id="preview-container">
      <div id="preview-wrapper">
        <div id="preview"></div>
        <div id="preview-resize-handle"></div>
      </div>
    </div>
  </div>

  <div id="zoom-toast"></div>

  <div id="drop-overlay">
    <div class="drop-message">Drop to open</div>
  </div>

  <div id="statusbar">
    <span id="status-mode">EDIT</span>
    <span id="status-file">Untitled</span>

    <span id="status-info"></span>

    <div id="status-editor-stats">
      <span id="status-length">length: 0</span>
      <span id="status-lines">lines: 1</span>
      <span id="status-cursor">Ln: 1&nbsp;&nbsp;Col: 1&nbsp;&nbsp;Pos: 0</span>
      <span id="status-counts">0 words</span>
    </div>
  </div>
  
  <div id="pdf-options-modal" class="modal-backdrop">
    <div class="modal-card">
      <div class="modal-title">Export PDF</div>

      <label class="pdf-option-row">
        <span>Text colour</span>
        <select id="pdf-color">
          <option value="blue" selected>Blue</option>
          <option value="black">Black</option>
        </select>
      </label>

      <label class="pdf-option-row">
        <span>Paper size</span>
        <select id="pdf-paper-size">
          <option value="a4" selected>A4</option>
          <option value="letter">Letter</option>
        </select>
      </label>

      <label class="pdf-option-row">
        <span>Orientation</span>
        <select id="pdf-orientation">
          <option value="portrait" selected>Portrait</option>
          <option value="landscape">Landscape</option>
        </select>
      </label>

      <label class="pdf-option-row">
        <span>Margins</span>
        <select id="pdf-margins">
          <option value="default" selected>Default</option>
          <option value="narrow">Narrow</option>
          <option value="wide">Wide</option>
        </select>
      </label>

      <label class="pdf-option-row">
        <span>Show timestamp</span>
        <input id="pdf-show-date" type="checkbox" checked>
      </label>

      <label class="pdf-option-row">
        <span>Show page numbers</span>
        <input id="pdf-show-pages" type="checkbox" checked>
      </label>

      <div class="modal-actions">
        <button id="pdf-cancel">Cancel</button>
        <button id="pdf-export-confirm" class="primary">Export</button>
      </div>
    </div>
</div>

<div id="close-confirm-modal" class="modal-backdrop">
  <div class="modal-card">
    <div class="modal-title">Unsaved changes</div>

    <div class="modal-message">
      You have unsaved changes. Close anyway?
    </div>

    <div class="modal-actions">
      <button id="close-cancel">Cancel</button>
      <button id="close-confirm" class="primary">Close</button>
    </div>
  </div>
</div>
<div id="guide-modal" class="modal-backdrop">
  <div class="guide-card">
    <div class="guide-header">
      <span>Markdown Guide</span>

      <div class="guide-search">
        <input
          id="guide-search-input"
          type="text"
          placeholder="Search guide..."
          spellcheck="false"
        >
        <span id="guide-search-count"></span>
      </div>

      <button id="guide-close" title="Close">
        ×
      </button>
    </div>

    <div id="guide-content"></div>
  </div>
</div>

<script>
  window.__MARKDOWN_GUIDE__ = "__GUIDE_MD__";
</script>
  <!-- __SCRIPTS__ -->
</body>
</html>
